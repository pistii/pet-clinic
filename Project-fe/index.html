    <style>
        .triangle {
        display: inline-block;
        transition: transform 0.3s linear;
        transform-origin: 50% 50%; /* Középpont (X: 50%, Y: 50%) */
        }

        .triangle.rotated {
        transform: rotate(180deg);
        }
        .collapse.show .triangle {
            transform: rotate(180deg);
        }

        .edit-icon {
            cursor: pointer;
            margin-left: 5px;
            fill: #007bff;
        }

        .hover {
            cursor: pointer;
        }
 
        .prevent-select {
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10 and IE 11 */
            user-select: none; /* Standard syntax */
        }
    </style>
