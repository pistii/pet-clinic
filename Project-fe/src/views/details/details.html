<div class="d-flex justify-content-end"><h3>Details</h3></div>

<div class="container col-md-6 bg-dark text-light rounded">
    <div class="d-flex justify-content-end">
        <button id="delete-btn" class="btn btn-danger mt-3" data-bs-toggle="tooltip" data-bs-placement="top" title="Delete account">
            Delete
        </button>
    </div>
    <form id="detailsForm">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
          </div>
          <button type="submit" onclick="saveDetails()" class="btn btn-primary">Save</button>
        </form>
    </form>
</div>

<script src="/src/views/details/details.js"></script>
