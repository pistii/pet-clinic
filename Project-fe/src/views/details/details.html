<div class="d-flex justify-content-end"><h3>Details</h3></div>

<div class="container col-md-6 bg-dark text-light rounded">
    <div class="d-flex justify-content-end">
        <button id="delete-btn" class="btn btn-danger mt-3" data-bs-toggle="tooltip" data-bs-placement="top" title="Delete account">
            Delete
        </button>
    </div>
    <form id="detailsForm" class="needs-validation" novalidate>
        <div class="validate">
          <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" class="form-control" id="username" required>
              <div class="invalid-feedback">Username cannot be empty.</div>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="email" required>
              <div class="invalid-feedback">Email cannot be empty.</div>
            </div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password">
          </div>
          <div class="mb-3">
            <label for="password1" class="form-label">Password again</label>
            <input type="password" class="form-control" id="password1">
            <div class="invalid-feedback" id="passwordErrorField">Password doesn't match</div>
          </div>
          <button type="submit" id="submit" class="btn btn-primary">Save</button>
        </form>
    </form>
</div>

<script src="/src/views/details/details.js"></script>
