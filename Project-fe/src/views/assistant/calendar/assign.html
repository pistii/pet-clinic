<div id="calendar"></div>

<dialog class="modal fade" id="assignModal" tabindex="-1" >
    <div class="modal-dialog modal-fullscreen">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title mx-4 mr-4" id="modalTitle">Assign Appointment</h5>
                <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true" class="pr-4">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="d-flex justify-content-center">
                    <button class="btn btn-secondary mx-2" id="medicalHistoryView">Medical history</button>
                    <button class="btn btn-secondary mx-2" id="detailsView">Details</button>
                    <button class="btn btn-secondary mx-2" id="diagnosisView">Diagnosis</button>
                </div>
                <div id="modalContent"></div>
                
            </div>
        </div>
    </div>
</dialog>

<style>
    #modalContent > div {
        transition: background-color 0.2s;
    }
    #modalContent > div:hover {
        background-color: #f8f9fa;
    }
    .border-primary-subtle {
        border-color: #0d6efd33 !important; /* halvány kék */
    }
</style>
