<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belépés és Regisztráció</title>
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

    <div class="container text-center">
        <h1 class="mb-3">Üdvözlünk!</h1>
        <p>Regisztráció nélkül is kérhetsz időpontot.</p>
        
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 shadow">
                    <h3 class="mb-3">Belépés</h3>
                    <form>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email cím</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Jelszó</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Belépés</button>
                    </form>
                    <hr>
                    <p>Még nincs fiókod?</p>
                    <button id="registerBtn" class="btn btn-success w-100">Regisztráció</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("registerBtn").addEventListener("click", function() {
            console.log("Regisztrálni szeretne.");
        });
    </script>

</body>
</html>
