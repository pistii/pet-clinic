<div class="container mt-5 d-flex justify-content-center">
  <div class="col-md-6">
      <h2 class="text-center">Appointment Request</h2>
      
      <form id="appointmentForm">
          <div class="form-group">
              <label for="name">Your Name</label>
              <input type="text" class="form-control" id="name" placeholder="Enter your name">
          </div>
          <div class="form-group">
              <label for="email">Email</label>
              <input type="email" class="form-control" id="email" placeholder="Enter your email">
          </div>
          
          <hr>
          
          <div class="form-group">
              <label for="pet-name">Pet Name</label>
              <input type="text" class="form-control" id="pet-name" placeholder="Enter pet's name">
          </div>
          <div class="form-group">
              <label for="dob">Date of Birth</label>
              <input type="date" class="form-control" id="dob">
          </div>
          <div class="form-group">
              <label for="species">Species</label>
              <input type="text" class="form-control" id="species" placeholder="Enter pet's species">
          </div>
          <div class="form-group">
              <label for="breed">Breed</label>
              <input type="text" class="form-control" id="breed" placeholder="Enter pet's breed">
          </div>
          <div class="form-group">
              <label for="description">Description</label>
              <textarea class="form-control" id="description" rows="3" placeholder="Describe your pet's issue"></textarea>
          </div>
          
           <div class="row">
            <div class="col">
              <a href="/login">Back to Login</a>

            </div>
            <div class="col">
              <button type="button" class="btn btn-primary btn-block" onclick="sendAppointment()">Send</button>
            </div>
           </DIV>
      </form>
  </div>
</div>

<script src="src/views/user/create_appointment/create_appointment.js" ></script>
